<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
viewport-fit=cover,
user-scalable=no">

<title>Realistic Flag</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at 48% 42%,
            #3a2b1d 0%,
            #21170e 38%,
            #0d0805 75%,
            #030201 100%
        );
}

body {
    touch-action: none;
}

canvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    display: block;
}

</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

/* =========================================================
   TELEGRAM
========================================================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp;

if (tg) {

    tg.ready();
    tg.expand();

    try {
        tg.setHeaderColor("#080503");
        tg.setBackgroundColor("#080503");
    } catch (e) {}

}


/* =========================================================
   WEBGL
========================================================= */

const canvas =
    document.getElementById("canvas");

const gl =
    canvas.getContext("webgl", {
        alpha: false,
        antialias: true
    });

if (!gl) {

    document.body.innerHTML = `
        <div style="
            color:white;
            font-family:sans-serif;
            text-align:center;
            padding:40px;
        ">
            WebGL روی این دستگاه پشتیبانی نمی‌شود.
        </div>
    `;

    throw new Error("WebGL unavailable");
}


/* =========================================================
   VERTEX SHADER
========================================================= */

const vertexSource = `

precision highp float;

attribute vec2 a_position;
attribute vec2 a_uv;

varying vec2 v_uv;
varying float v_wave;

uniform float u_time;


/* ---------------------------------------------------------
   موج پارچه
--------------------------------------------------------- */

float fabricWave(vec2 uv) {

    float u = uv.x;
    float v = uv.y;

    /*
       موج بزرگ پارچه
    */

    float wave1 =
        sin(
            u * 15.0
            - u_time * 1.35
            + v * 1.7
        );


    /*
       موج دوم
    */

    float wave2 =
        sin(
            u * 31.0
            - u_time * 2.1
            - v * 4.0
        );


    /*
       چین ریز
    */

    float wave3 =
        sin(
            u * 65.0
            - u_time * 3.0
            + v * 12.0
        );


    /*
       نزدیک میله کمتر حرکت کند
    */

    float envelope =
        smoothstep(
            0.0,
            0.20,
            u
        );


    return
        (
            wave1 * 0.70
            +
            wave2 * 0.22
            +
            wave3 * 0.08
        )
        *
        envelope;
}


void main() {

    vec2 uv =
        a_uv;

    float wave =
        fabricWave(uv);


    /*
       عمق چین
    */

    float z =
        wave * 0.16;


    /*
       عرض پرچم
    */

    float x =
        (uv.x - 0.5)
        * 1.55;


    /*
       ارتفاع پرچم
    */

    float y =
        (0.5 - uv.y)
        * 0.88;


    /*
       لبه آزاد کمی نامنظم
    */

    float edge =
        smoothstep(
            0.52,
            1.0,
            uv.x
        );


    y +=
        sin(
            uv.x * 3.14159
            - u_time * 0.8
        )
        *
        0.045
        *
        edge;


    gl_Position =
        vec4(
            x,
            y,
            z,
            1.0
        );


    v_uv =
        uv;

    v_wave =
        wave;
}

`;


/* =========================================================
   FRAGMENT SHADER
========================================================= */

const fragmentSource = `

precision highp float;

uniform sampler2D u_texture;
uniform float u_time;

varying vec2 v_uv;
varying float v_wave;


/* ---------------------------------------------------------
   Noise
--------------------------------------------------------- */

float hash(vec2 p) {

    return fract(
        sin(
            dot(
                p,
                vec2(
                    127.1,
                    311.7
                )
            )
        )
        * 43758.5453
    );
}


float noise(vec2 p) {

    vec2 i =
        floor(p);

    vec2 f =
        fract(p);

    f =
        f * f *
        (
            3.0
            -
            2.0 * f
        );


    float a =
        hash(i);

    float b =
        hash(
            i + vec2(1.0, 0.0)
        );

    float c =
        hash(
            i + vec2(0.0, 1.0)
        );

    float d =
        hash(
            i + vec2(1.0, 1.0)
        );


    return mix(
        mix(a, b, f.x),
        mix(c, d, f.x),
        f.y
    );
}


/* ---------------------------------------------------------
   ارتفاع پارچه
--------------------------------------------------------- */

float cloth(vec2 uv) {

    float u =
        uv.x;

    float v =
        uv.y;


    float a =
        sin(
            u * 15.0
            - u_time * 1.35
            + v * 1.7
        );


    float b =
        sin(
            u * 31.0
            - u_time * 2.1
            - v * 4.0
        );


    float c =
        sin(
            u * 65.0
            - u_time * 3.0
            + v * 12.0
        );


    float envelope =
        smoothstep(
            0.0,
            0.20,
            u
        );


    return
        (
            a * 0.70
            +
            b * 0.22
            +
            c * 0.08
        )
        *
        envelope;
}


/* ---------------------------------------------------------
   نورپردازی چین
--------------------------------------------------------- */

float clothLighting(vec2 uv) {

    float d =
        0.0025;


    float left =
        cloth(
            uv -
            vec2(d, 0.0)
        );


    float right =
        cloth(
            uv +
            vec2(d, 0.0)
        );


    float up =
        cloth(
            uv +
            vec2(0.0, d)
        );


    float down =
        cloth(
            uv -
            vec2(0.0, d)
        );


    float dx =
        (right - left)
        * 2.5;


    float dy =
        (up - down)
        * 2.5;


    vec3 normal =
        normalize(
            vec3(
                -dx,
                -dy,
                1.0
            )
        );


    /*
       نور سینمایی از بالا چپ
    */

    vec3 light =
        normalize(
            vec3(
                -0.65,
                -0.75,
                1.0
            )
        );


    float diffuse =
        dot(
            normal,
            light
        );


    return
        0.55
        +
        diffuse * 0.45;
}


/* ---------------------------------------------------------
   MAIN
--------------------------------------------------------- */

void main() {

    vec2 uv =
        v_uv;


    /*
       طرح اصلی پرچم
    */

    vec4 flag =
        texture2D(
            u_texture,
            uv
        );


    /*
       نور چین‌ها
    */

    float lighting =
        clothLighting(uv);


    /*
       بافت تار و پود
    */

    float thread1 =
        sin(
            uv.x * 850.0
        );


    float thread2 =
        sin(
            uv.y * 850.0
        );


    float threads =
        (
            thread1
            +
            thread2
        )
        * 0.010;


    /*
       نویز خیلی ظریف پارچه
    */

    float grain =
        noise(
            uv * 450.0
        )
        * 0.025;


    /*
       نور روی پارچه
    */

    vec3 color =
        flag.rgb
        *
        lighting;


    /*
       تار و پود
    */

    color +=
        vec3(
            threads
            +
            grain
        );


    /*
       عمق چین‌ها
    */

    color *=
        1.0
        +
        v_wave * 0.22;


    /*
       کمی تیرگی در کناره‌ها
    */

    float edgeX =
        smoothstep(
            0.0,
            0.045,
            uv.x
        )
        *
        smoothstep(
            1.0,
            0.955,
            uv.x
        );


    float edgeY =
        smoothstep(
            0.0,
            0.035,
            uv.y
        )
        *
        smoothstep(
            1.0,
            0.965,
            uv.y
        );


    color *=
        0.80
        +
        edgeX
        *
        edgeY
        *
        0.20;


    gl_FragColor =
        vec4(
            color,
            1.0
        );
}

`;


/* =========================================================
   SHADER CREATION
========================================================= */

function createShader(type, source) {

    const shader =
        gl.createShader(type);

    gl.shaderSource(
        shader,
        source
    );

    gl.compileShader(
        shader
    );


    if (
        !gl.getShaderParameter(
            shader,
            gl.COMPILE_STATUS
        )
    ) {

        console.error(
            gl.getShaderInfoLog(shader)
        );

        throw new Error(
            gl.getShaderInfoLog(shader)
        );
    }


    return shader;
}


const vertexShader =
    createShader(
        gl.VERTEX_SHADER,
        vertexSource
    );


const fragmentShader =
    createShader(
        gl.FRAGMENT_SHADER,
        fragmentSource
    );


/* =========================================================
   PROGRAM
========================================================= */

const program =
    gl.createProgram();

gl.attachShader(
    program,
    vertexShader
);

gl.attachShader(
    program,
    fragmentShader
);

gl.linkProgram(
    program
);


if (
    !gl.getProgramParameter(
        program,
        gl.LINK_STATUS
    )
) {

    console.error(
        gl.getProgramInfoLog(program)
    );

    throw new Error(
        gl.getProgramInfoLog(program)
    );
}


gl.useProgram(
    program
);


/* =========================================================
   MESH
========================================================= */

/*
   180 × 90
   تعداد vertices کمتر از 65535 است،
   بنابراین Uint16 کاملاً کافی است.
*/

const COLS = 180;
const ROWS = 90;

const vertices = [];
const indices = [];


for (
    let y = 0;
    y <= ROWS;
    y++
) {

    for (
        let x = 0;
        x <= COLS;
        x++
    ) {

        const u =
            x / COLS;

        const v =
            y / ROWS;


        /*
           position + UV
        */

        vertices.push(
            u,
            v,
            u,
            v
        );
    }
}


for (
    let y = 0;
    y < ROWS;
    y++
) {

    for (
        let x = 0;
        x < COLS;
        x++
    ) {

        const i =
            y * (COLS + 1)
            + x;


        indices.push(
            i,
            i + 1,
            i + COLS + 1,

            i + 1,
            i + COLS + 2,
            i + COLS + 1
        );
    }
}


/* =========================================================
   BUFFERS
========================================================= */

const vertexBuffer =
    gl.createBuffer();

gl.bindBuffer(
    gl.ARRAY_BUFFER,
    vertexBuffer
);

gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array(vertices),
    gl.STATIC_DRAW
);


const indexBuffer =
    gl.createBuffer();

gl.bindBuffer(
    gl.ELEMENT_ARRAY_BUFFER,
    indexBuffer
);

gl.bufferData(
    gl.ELEMENT_ARRAY_BUFFER,
    new Uint16Array(indices),
    gl.STATIC_DRAW
);


/* =========================================================
   ATTRIBUTES
========================================================= */

const positionLocation =
    gl.getAttribLocation(
        program,
        "a_position"
    );


const uvLocation =
    gl.getAttribLocation(
        program,
        "a_uv"
    );


gl.bindBuffer(
    gl.ARRAY_BUFFER,
    vertexBuffer
);


gl.enableVertexAttribArray(
    positionLocation
);


gl.vertexAttribPointer(
    positionLocation,
    2,
    gl.FLOAT,
    false,
    16,
    0
);


gl.enableVertexAttribArray(
    uvLocation
);


gl.vertexAttribPointer(
    uvLocation,
    2,
    gl.FLOAT,
    false,
    16,
    8
);


/* =========================================================
   UNIFORMS
========================================================= */

const timeLocation =
    gl.getUniformLocation(
        program,
        "u_time"
    );


const textureLocation =
    gl.getUniformLocation(
        program,
        "u_texture"
    );


/* =========================================================
   TEXTURE
========================================================= */

const texture =
    gl.createTexture();


gl.bindTexture(
    gl.TEXTURE_2D,
    texture
);


/*
   یک تصویر موقت سفید
   تا قبل از لود شدن flag.jpg
   صفحه سیاه نشود.
*/

const whitePixel =
    new Uint8Array([
        255,
        255,
        255,
        255
    ]);


gl.texImage2D(
    gl.TEXTURE_2D,
    0,
    gl.RGBA,
    1,
    1,
    0,
    gl.RGBA,
    gl.UNSIGNED_BYTE,
    whitePixel
);


/*
   مهم:
   بدون mipmap
   تا تصاویر با هر ابعادی کار کنند.
*/

gl.texParameteri(
    gl.TEXTURE_2D,
    gl.TEXTURE_MIN_FILTER,
    gl.LINEAR
);

gl.texParameteri(
    gl.TEXTURE_2D,
    gl.TEXTURE_MAG_FILTER,
    gl.LINEAR
);

gl.texParameteri(
    gl.TEXTURE_2D,
    gl.TEXTURE_WRAP_S,
    gl.CLAMP_TO_EDGE
);

gl.texParameteri(
    gl.TEXTURE_2D,
    gl.TEXTURE_WRAP_T,
    gl.CLAMP_TO_EDGE
);


/* =========================================================
   LOAD FLAG
========================================================= */

const flagImage =
    new Image();


flagImage.onload = function () {

    gl.bindTexture(
        gl.TEXTURE_2D,
        texture
    );


    gl.pixelStorei(
        gl.UNPACK_FLIP_Y_WEBGL,
        true
    );


    gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        flagImage
    );


    console.log(
        "flag.jpg loaded:",
        flagImage.width,
        flagImage.height
    );
};


flagImage.onerror = function () {

    console.error(
        "ERROR: flag.jpg پیدا نشد!"
    );

};


flagImage.src =
    "./flag.jpg";


/* =========================================================
   RESIZE
========================================================= */

function resize() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    canvas.width =
        Math.floor(
            width * dpr
        );


    canvas.height =
        Math.floor(
            height * dpr
        );


    canvas.style.width =
        width + "px";


    canvas.style.height =
        height + "px";


    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   RENDER
========================================================= */

function render(time) {

    resize();


    /*
       پس‌زمینه
    */

    gl.clearColor(
        0.025,
        0.015,
        0.009,
        1.0
    );


    gl.clear(
        gl.COLOR_BUFFER_BIT
    );


    gl.useProgram(
        program
    );


    /*
       زمان
    */

    gl.uniform1f(
        timeLocation,
        time * 0.001
    );


    /*
       تکسچر
    */

    gl.activeTexture(
        gl.TEXTURE0
    );


    gl.bindTexture(
        gl.TEXTURE_2D,
        texture
    );


    gl.uniform1i(
        textureLocation,
        0
    );


    /*
       پرچم
    */

    gl.drawElements(
        gl.TRIANGLES,
        indices.length,
        gl.UNSIGNED_SHORT,
        0
    );


    requestAnimationFrame(
        render
    );
}


/*
   مهم:
   رندر را بدون منتظر ماندن
   برای عکس شروع می‌کنیم.
*/

requestAnimationFrame(
    render
);

</script>

</body>
</html>
