<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover,
               user-scalable=no">

<title>Realistic Flag</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at 50% 45%,
            #38291b 0%,
            #20150c 42%,
            #0b0704 78%,
            #020100 100%
        );

    touch-action: none;
    overscroll-behavior: none;
}

canvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    touch-action: none;
}
</style>

</head>

<body>

<canvas id="canvas"></canvas>

<script>

/* =========================================================
   TELEGRAM
========================================================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp;

if (tg) {

    tg.ready();
    tg.expand();

    try {
        tg.setHeaderColor("#080503");
        tg.setBackgroundColor("#080503");
    } catch (e) {}

}


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("canvas");

const gl =
    canvas.getContext("webgl", {
        alpha: false,
        antialias: true,
        premultipliedAlpha: false
    });

if (!gl) {

    document.body.innerHTML = `
        <div style="
            color:white;
            text-align:center;
            padding:40px;
            font-family:sans-serif;
        ">
        WebGL روی این دستگاه پشتیبانی نمی‌شود.
        </div>
    `;

    throw new Error("WebGL unavailable");
}


/* =========================================================
   VERTEX SHADER
========================================================= */

const vertexShaderSource = `

precision highp float;

attribute vec2 a_position;
attribute vec2 a_uv;

uniform float u_time;

uniform vec2 u_wind;

uniform float u_windPower;

varying vec2 v_uv;

varying float v_wave;

varying float v_light;


/* ---------------------------------------------------------
   ترکیب موج‌های پارچه
--------------------------------------------------------- */

float fabricWave(vec2 uv)
{

    float u = uv.x;
    float v = uv.y;

    float envelope =
        smoothstep(
            0.0,
            0.16,
            u
        );


    /*
       موج بزرگ
    */

    float wave1 =
        sin(
            u * 13.0
            -
            u_time * 1.15
            +
            v * 1.8
        );


    /*
       موج متوسط
    */

    float wave2 =
        sin(
            u * 27.0
            -
            u_time * 1.85
            +
            v * 5.0
        );


    /*
       چین‌های ریز
    */

    float wave3 =
        sin(
            u * 58.0
            -
            u_time * 2.7
            +
            v * 11.0
        );


    /*
       موج ناشی از دست
    */

    float windWave =
        sin(
            u * 17.0
            -
            u_time * 1.4
            +
            v * 5.0
        );


    float result =
        wave1 * 0.52
        +
        wave2 * 0.25
        +
        wave3 * 0.10
        +
        windWave * u_windPower * 0.22;


    return
        result
        * envelope;
}


/* ---------------------------------------------------------
   MAIN
--------------------------------------------------------- */

void main()
{

    vec2 uv =
        a_uv;


    float wave =
        fabricWave(uv);


    /*
       اثر مستقیم حرکت دست
    */

    float dragX =
        u_wind.x
        *
        uv.x
        *
        uv.x;


    float dragY =
        u_wind.y
        *
        uv.x
        *
        uv.x;


    /*
       موج عمق پارچه
    */

    float depth =
        wave * 0.16;


    /*
       عرض
    */

    float x =
        (uv.x - 0.5)
        * 1.60;


    /*
       ارتفاع
    */

    float y =
        (0.5 - uv.y)
        * 0.88;


    /*
       حرکت با دست
    */

    x += dragX * 0.32;

    y += dragY * 0.32;


    /*
       لبه آزاد پرچم
       نامنظم و طبیعی
    */

    float edge =
        smoothstep(
            0.55,
            1.0,
            uv.x
        );


    y +=
        sin(
            uv.x * 6.0
            -
            u_time * 0.7
        )
        *
        0.045
        *
        edge;


    /*
       کمی افت طبیعی پارچه
    */

    y -=
        uv.x
        *
        uv.x
        *
        0.025;


    gl_Position =
        vec4(
            x,
            y,
            depth,
            1.0
        );


    v_uv =
        uv;


    v_wave =
        wave;


    /*
       نور پایه
    */

    v_light =
        0.5
        +
        0.5 *
        sin(
            wave * 4.0
        );
}

`;


/* =========================================================
   FRAGMENT SHADER
========================================================= */

const fragmentShaderSource = `

precision highp float;

uniform sampler2D u_texture;

uniform float u_time;

varying vec2 v_uv;

varying float v_wave;

varying float v_light;


/* ---------------------------------------------------------
   HASH
--------------------------------------------------------- */

float hash(vec2 p)
{

    return fract(
        sin(
            dot(
                p,
                vec2(
                    127.1,
                    311.7
                )
            )
        )
        *
        43758.5453123
    );
}


/* ---------------------------------------------------------
   NOISE
--------------------------------------------------------- */

float noise(vec2 p)
{

    vec2 i =
        floor(p);

    vec2 f =
        fract(p);

    f =
        f * f *
        (
            3.0
            -
            2.0 * f
        );


    float a =
        hash(i);

    float b =
        hash(
            i +
            vec2(
                1.0,
                0.0
            )
        );

    float c =
        hash(
            i +
            vec2(
                0.0,
                1.0
            )
        );

    float d =
        hash(
            i +
            vec2(
                1.0,
                1.0
            )
        );


    return mix(
        mix(a,b,f.x),
        mix(c,d,f.x),
        f.y
    );
}


/* ---------------------------------------------------------
   FABRIC
--------------------------------------------------------- */

float cloth(vec2 uv)
{

    float u =
        uv.x;

    float v =
        uv.y;


    float envelope =
        smoothstep(
            0.0,
            0.16,
            u
        );


    float a =
        sin(
            u * 13.0
            -
            u_time * 1.15
            +
            v * 1.8
        );


    float b =
        sin(
            u * 27.0
            -
            u_time * 1.85
            +
            v * 5.0
        );


    float c =
        sin(
            u * 58.0
            -
            u_time * 2.7
            +
            v * 11.0
        );


    return
        (
            a * 0.52
            +
            b * 0.25
            +
            c * 0.10
        )
        *
        envelope;
}


/* ---------------------------------------------------------
   نورپردازی چین
--------------------------------------------------------- */

float clothLighting(vec2 uv)
{

    float e =
        0.002;


    float l =
        cloth(
            uv -
            vec2(e,0.0)
        );


    float r =
        cloth(
            uv +
            vec2(e,0.0)
        );


    float t =
        cloth(
            uv +
            vec2(0.0,e)
        );


    float b =
        cloth(
            uv -
            vec2(0.0,e)
        );


    float dx =
        (r-l)
        * 3.0;


    float dy =
        (t-b)
        * 3.0;


    vec3 normal =
        normalize(
            vec3(
                -dx,
                -dy,
                1.0
            )
        );


    vec3 light =
        normalize(
            vec3(
                -0.65,
                -0.75,
                1.0
            )
        );


    return
        0.62
        +
        max(
            dot(
                normal,
                light
            ),
            0.0
        )
        *
        0.48;
}


/* ---------------------------------------------------------
   MAIN
--------------------------------------------------------- */

void main()
{

    vec2 uv =
        v_uv;


    /*
       تصویر اصلی
    */

    vec4 tex =
        texture2D(
            u_texture,
            uv
        );


    /*
       نور چین‌ها
    */

    float lighting =
        clothLighting(uv);


    /*
       تار پارچه
    */

    float threadX =
        sin(
            uv.x * 900.0
        );


    float threadY =
        sin(
            uv.y * 900.0
        );


    float threads =
        (
            threadX
            +
            threadY
        )
        *
        0.007;


    /*
       بافت بسیار ریز
    */

    float grain =
        noise(
            uv * 320.0
        )
        *
        0.018;


    /*
       رنگ نهایی
    */

    vec3 color =
        tex.rgb
        *
        lighting;


    /*
       تار و پود
    */

    color +=
        vec3(
            threads
            +
            grain
        );


    /*
       عمق چین
    */

    color *=
        1.0
        +
        v_wave * 0.20;


    /*
       کمی تیرگی در لبه‌ها
    */

    float edge =
        smoothstep(
            0.0,
            0.05,
            uv.x
        )
        *
        smoothstep(
            1.0,
            0.94,
            uv.x
        );


    color *=
        0.84
        +
        edge * 0.16;


    gl_FragColor =
        vec4(
            color,
            1.0
        );
}

`;


/* =========================================================
   SHADER FUNCTION
========================================================= */

function makeShader(type, source)
{

    const shader =
        gl.createShader(type);

    gl.shaderSource(
        shader,
        source
    );

    gl.compileShader(
        shader
    );


    if (
        !gl.getShaderParameter(
            shader,
            gl.COMPILE_STATUS
        )
    ) {

        console.error(
            gl.getShaderInfoLog(shader)
        );

        throw new Error(
            gl.getShaderInfoLog(shader)
        );
    }


    return shader;
}


/* =========================================================
   PROGRAM
========================================================= */

const vertexShader =
    makeShader(
        gl.VERTEX_SHADER,
        vertexShaderSource
    );


const fragmentShader =
    makeShader(
        gl.FRAGMENT_SHADER,
        fragmentShaderSource
    );


const program =
    gl.createProgram();


gl.attachShader(
    program,
    vertexShader
);


gl.attachShader(
    program,
    fragmentShader
);


gl.linkProgram(
    program
);


if (
    !gl.getProgramParameter(
        program,
        gl.LINK_STATUS
    )
) {

    throw new Error(
        gl.getProgramInfoLog(program)
    );
}


gl.useProgram(program);


/* =========================================================
   FABRIC MESH
========================================================= */

const COLS = 180;
const ROWS = 100;

const vertices = [];
const indices = [];


for (
    let y = 0;
    y <= ROWS;
    y++
) {

    for (
        let x = 0;
        x <= COLS;
        x++
    ) {

        const u =
            x / COLS;

        const v =
            y / ROWS;


        vertices.push(
            u,
            v,
            u,
            v
        );
    }
}


for (
    let y = 0;
    y < ROWS;
    y++
) {

    for (
        let x = 0;
        x < COLS;
        x++
    ) {

        const i =
            y * (COLS + 1)
            + x;


        indices.push(
            i,
            i + 1,
            i + COLS + 1,

            i + 1,
            i + COLS + 2,
            i + COLS + 1
        );
    }
}


/* =========================================================
   BUFFER
========================================================= */

const vertexBuffer =
    gl.createBuffer();


gl.bindBuffer(
    gl.ARRAY_BUFFER,
    vertexBuffer
);


gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array(vertices),
    gl.STATIC_DRAW
);


const indexBuffer =
    gl.createBuffer();


gl.bindBuffer(
    gl.ELEMENT_ARRAY_BUFFER,
    indexBuffer
);


gl.bufferData(
    gl.ELEMENT_ARRAY_BUFFER,
    new Uint16Array(indices),
    gl.STATIC_DRAW
);


/* =========================================================
   ATTRIBUTES
========================================================= */

const positionLocation =
    gl.getAttribLocation(
        program,
        "a_position"
    );


const uvLocation =
    gl.getAttribLocation(
        program,
        "a_uv"
    );


gl.bindBuffer(
    gl.ARRAY_BUFFER,
    vertexBuffer
);


gl.enableVertexAttribArray(
    positionLocation
);


gl.vertexAttribPointer(
    positionLocation,
    2,
    gl.FLOAT,
    false,
    16,
    0
);


gl.enableVertexAttribArray(
    uvLocation
);


gl.vertexAttribPointer(
    uvLocation,
    2,
    gl.FLOAT,
    false,
    16,
    8
);


/* =========================================================
   UNIFORMS
========================================================= */

const timeLocation =
    gl.getUniformLocation(
        program,
        "u_time"
    );


const windLocation =
    gl.getUniformLocation(
        program,
        "u_wind"
    );


const windPowerLocation =
    gl.getUniformLocation(
        program,
        "u_windPower"
    );


const textureLocation =
    gl.getUniformLocation(
        program,
        "u_texture"
    );


/* =========================================================
   TEXTURE
========================================================= */

const texture =
    gl.createTexture();


gl.bindTexture(
    gl.TEXTURE_2D,
    texture
);


/*
   ابتدا یک پیکسل سفید
*/

gl.texImage2D(
    gl.TEXTURE_2D,
    0,
    gl.RGBA,
    1,
    1,
    0,
    gl.RGBA,
    gl.UNSIGNED_BYTE,
    new Uint8Array([
        255,
        255,
        255,
        255
    ])
);


gl.texParameteri(
    gl.TEXTURE_2D,
    gl.TEXTURE_MIN_FILTER,
    gl.LINEAR
);


gl.texParameteri(
    gl.TEXTURE_2D,
    gl.TEXTURE_MAG_FILTER,
    gl.LINEAR
);


gl.texParameteri(
    gl.TEXTURE_2D,
    gl.TEXTURE_WRAP_S,
    gl.CLAMP_TO_EDGE
);


gl.texParameteri(
    gl.TEXTURE_2D,
    gl.TEXTURE_WRAP_T,
    gl.CLAMP_TO_EDGE
);


/* =========================================================
   FLAG IMAGE
========================================================= */

const flagImage =
    new Image();


flagImage.onload =
function()
{

    gl.bindTexture(
        gl.TEXTURE_2D,
        texture
    );


    gl.pixelStorei(
        gl.UNPACK_FLIP_Y_WEBGL,
        true
    );


    gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        flagImage
    );


    console.log(
        "FLAG LOADED:",
        flagImage.width,
        flagImage.height
    );
};


flagImage.onerror =
function()
{

    console.error(
        "flag.jpg پیدا نشد!"
    );
};


flagImage.src =
    "./flag.jpg";


/* =========================================================
   RESIZE
========================================================= */

function resize()
{

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    const w =
        window.innerWidth;


    const h =
        window.innerHeight;


    canvas.width =
        Math.floor(
            w * dpr
        );


    canvas.height =
        Math.floor(
            h * dpr
        );


    canvas.style.width =
        w + "px";


    canvas.style.height =
        h + "px";


    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


window.addEventListener(
    "resize",
    resize
);


resize();


/* =========================================================
   TOUCH / POINTER PHYSICS
========================================================= */

let pointerDown =
    false;


let lastX =
    0;


let lastY =
    0;


let windX =
    0;


let windY =
    0;


let targetWindX =
    0;


let targetWindY =
    0;


let windPower =
    0;


let targetPower =
    0;


/*
   برای حرکت بسیار سریع
   محدودیت می‌گذاریم تا پرچم
   منفجر نشود.
*/

function clamp(
    value,
    min,
    max
)
{

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );
}


/* ---------------------------------------------------------
   شروع لمس
--------------------------------------------------------- */

function pointerStart(e)
{

    pointerDown =
        true;


    const p =
        e.touches
        ? e.touches[0]
        : e;


    lastX =
        p.clientX;


    lastY =
        p.clientY;


    targetWindX =
        0;


    targetWindY =
        0;


    targetPower =
        0;


    e.preventDefault();
}


/* ---------------------------------------------------------
   حرکت انگشت
--------------------------------------------------------- */

function pointerMove(e)
{

    if (!pointerDown)
        return;


    const p =
        e.touches
        ? e.touches[0]
        : e;


    const dx =
        p.clientX
        -
        lastX;


    const dy =
        p.clientY
        -
        lastY;


    lastX =
        p.clientX;


    lastY =
        p.clientY;


    /*
       سرعت حرکت دست
    */

    targetWindX =
        clamp(
            dx * 0.035,
            -0.65,
            0.65
        );


    targetWindY =
        clamp(
            -dy * 0.035,
            -0.65,
            0.65
        );


    const speed =
        Math.sqrt(
            dx * dx
            +
            dy * dy
        );


    targetPower =
        clamp(
            speed * 0.055,
            0.0,
            1.0
        );


    e.preventDefault();
}


/* ---------------------------------------------------------
   پایان لمس
--------------------------------------------------------- */

function pointerEnd(e)
{

    pointerDown =
        false;

    e.preventDefault();
}


/* ---------------------------------------------------------
   Touch
--------------------------------------------------------- */

canvas.addEventListener(
    "touchstart",
    pointerStart,
    {
        passive:false
    }
);


canvas.addEventListener(
    "touchmove",
    pointerMove,
    {
        passive:false
    }
);


canvas.addEventListener(
    "touchend",
    pointerEnd,
    {
        passive:false
    }
);


canvas.addEventListener(
    "touchcancel",
    pointerEnd,
    {
        passive:false
    }
);


/* ---------------------------------------------------------
   Mouse
--------------------------------------------------------- */

canvas.addEventListener(
    "mousedown",
    pointerStart
);


canvas.addEventListener(
    "mousemove",
    pointerMove
);


canvas.addEventListener(
    "mouseup",
    pointerEnd
);


canvas.addEventListener(
    "mouseleave",
    pointerEnd
);


/* =========================================================
   PHYSICS LOOP
========================================================= */

function updatePhysics()
{

    if (!pointerDown)
    {

        /*
           بعد از رها کردن
           باد به تدریج می‌خوابد.
        */

        targetWindX *= 0.965;

        targetWindY *= 0.965;

        targetPower *= 0.965;
    }


    /*
       نرمی حرکت
    */

    windX +=
        (
            targetWindX
            -
            windX
        )
        *
        0.18;


    windY +=
        (
            targetWindY
            -
            windY
        )
        *
        0.18;


    windPower +=
        (
            targetPower
            -
            windPower
        )
        *
        0.12;
}


/* =========================================================
   RENDER
========================================================= */

function render(time)
{

    updatePhysics();


    gl.clearColor(
        0.025,
        0.015,
        0.008,
        1.0
    );


    gl.clear(
        gl.COLOR_BUFFER_BIT
    );


    gl.useProgram(
        program
    );


    /*
       زمان
    */

    gl.uniform1f(
        timeLocation,
        time * 0.001
    );


    /*
       جهت دست
    */

    gl.uniform2f(
        windLocation,
        windX,
        windY
    );


    /*
       شدت باد
    */

    gl.uniform1f(
        windPowerLocation,
        windPower
    );


    /*
       تصویر
    */

    gl.activeTexture(
        gl.TEXTURE0
    );


    gl.bindTexture(
        gl.TEXTURE_2D,
        texture
    );


    gl.uniform1i(
        textureLocation,
        0
    );


    /*
       پارچه
    */

    gl.drawElements(
        gl.TRIANGLES,
        indices.length,
        gl.UNSIGNED_SHORT,
        0
    );


    requestAnimationFrame(
        render
    );
}


requestAnimationFrame(
    render
);

</script>

</body>
</html>
