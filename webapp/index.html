<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      viewport-fit=cover,
      user-scalable=no">

<title>Realistic Flag</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background:
        radial-gradient(
            ellipse at 48% 42%,
            #34291d 0%,
            #20170f 35%,
            #0d0906 72%,
            #050302 100%
        );
}

body {
    touch-action: none;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

/* =========================================================
   TELEGRAM
========================================================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp;

if (tg) {
    tg.ready();
    tg.expand();

    try {
        tg.setHeaderColor("#090604");
        tg.setBackgroundColor("#090604");
    } catch (e) {}
}


/* =========================================================
   CANVAS / WEBGL
========================================================= */

const canvas =
    document.getElementById("canvas");

const gl =
    canvas.getContext("webgl", {
        alpha: false,
        antialias: true,
        premultipliedAlpha: false
    });

if (!gl) {
    document.body.innerHTML =
        "<div style='color:white;padding:30px;text-align:center;font-family:sans-serif'>WebGL روی این دستگاه پشتیبانی نمی‌شود.</div>";
    throw new Error("WebGL unavailable");
}


/* =========================================================
   SHADER SOURCES
========================================================= */

/*
   Vertex Shader

   سطح پرچم به تعداد زیادی نقطه تقسیم می‌شود.
   هر نقطه عمق متفاوت دارد و همین باعث ایجاد
   چین واقعی‌نما می‌شود.
*/

const vertexShaderSource = `

precision highp float;

attribute vec2 a_position;
attribute vec2 a_uv;

uniform float u_aspect;
uniform float u_flagAspect;

varying vec2 v_uv;
varying float v_depth;


/* ---------------------------------------------------------
   تابع چین پارچه
--------------------------------------------------------- */

float clothWave(vec2 uv) {

    float u = uv.x;
    float v = uv.y;

    /*
       چین‌های اصلی و بزرگ
    */

    float large =
        sin(
            u * 15.0
            + v * 1.8
        ) * 0.70;


    /*
       چین‌های مورب
    */

    float diagonal =
        sin(
            u * 31.0
            - v * 5.0
        ) * 0.23;


    /*
       چین‌های ریز
    */

    float small =
        sin(
            u * 62.0
            + v * 11.0
        ) * 0.08;


    /*
       نزدیک میله تقریباً ثابت
    */

    float envelope =
        smoothstep(
            0.0,
            0.28,
            u
        );


    /*
       ترکیب
    */

    return
        (large + diagonal + small)
        * envelope;
}


void main() {

    vec2 uv = a_uv;

    float u = uv.x;
    float v = uv.y;


    /*
       شدت چین
    */

    float wave =
        clothWave(uv);


    /*
       کمی افت طبیعی در انتهای آزاد
    */

    float freeEdge =
        smoothstep(
            0.55,
            1.0,
            u
        );


    /*
       عمق پارچه
    */

    float z =
        wave
        * 0.17
        * (0.75 + freeEdge * 0.55);


    /*
       خم شدن لبه آزاد
    */

    float edgeCurve =
        sin(
            u * 3.14159265
        ) * 0.025;


    /*
       مختصات صفحه
    */

    float x =
        (u - 0.5)
        * 1.55;


    float y =
        (0.5 - v)
        * 0.92;


    /*
       لبه آزاد کمی بالا و پایین می‌شود
    */

    y +=
        sin(
            u * 3.14159265
            + 0.8
        )
        * 0.055
        * freeEdge;


    /*
       اعمال عمق
    */

    gl_Position =
        vec4(
            x,
            y,
            z,
            1.0
        );


    v_uv =
        uv;

    v_depth =
        z;
}

`;


/* =========================================================
   FRAGMENT SHADER
========================================================= */

const fragmentShaderSource = `

precision highp float;

uniform sampler2D u_texture;
uniform float u_time;

varying vec2 v_uv;
varying float v_depth;


/* ---------------------------------------------------------
   Noise
--------------------------------------------------------- */

float hash(vec2 p) {

    return fract(
        sin(
            dot(
                p,
                vec2(
                    127.1,
                    311.7
                )
            )
        )
        * 43758.5453123
    );
}


float noise(vec2 p) {

    vec2 i =
        floor(p);

    vec2 f =
        fract(p);

    f =
        f * f *
        (3.0 - 2.0 * f);


    float a =
        hash(i);

    float b =
        hash(i + vec2(1.0, 0.0));

    float c =
        hash(i + vec2(0.0, 1.0));

    float d =
        hash(i + vec2(1.0, 1.0));


    return mix(
        mix(a, b, f.x),
        mix(c, d, f.x),
        f.y
    );
}


/* ---------------------------------------------------------
   Fabric height
--------------------------------------------------------- */

float fabricHeight(vec2 uv) {

    float u = uv.x;
    float v = uv.y;


    float a =
        sin(
            u * 15.0
            + v * 1.8
        );


    float b =
        sin(
            u * 31.0
            - v * 5.0
        );


    float c =
        sin(
            u * 63.0
            + v * 10.0
        );


    float envelope =
        smoothstep(
            0.0,
            0.22,
            u
        );


    return
        (a * 0.65
        + b * 0.24
        + c * 0.09)
        * envelope;
}


/* ---------------------------------------------------------
   Fabric lighting
--------------------------------------------------------- */

float fabricLight(vec2 uv) {

    float px = 0.0018;


    float left =
        fabricHeight(
            uv - vec2(px, 0.0)
        );

    float right =
        fabricHeight(
            uv + vec2(px, 0.0)
        );

    float up =
        fabricHeight(
            uv + vec2(0.0, px)
        );

    float down =
        fabricHeight(
            uv - vec2(0.0, px)
        );


    float dx =
        (right - left) * 2.2;

    float dy =
        (up - down) * 2.2;


    vec3 normal =
        normalize(
            vec3(
                -dx,
                -dy,
                1.0
            )
        );


    /*
       نور اصلی از بالا و چپ
    */

    vec3 lightDirection =
        normalize(
            vec3(
                -0.65,
                -0.75,
                0.95
            )
        );


    float diffuse =
        dot(
            normal,
            lightDirection
        );


    diffuse =
        diffuse * 0.5
        + 0.5;


    return diffuse;
}


/* ---------------------------------------------------------
   Main
--------------------------------------------------------- */

void main() {

    vec2 uv =
        v_uv;


    /*
       تصویر اصلی

       طرح پرچم کاملاً از flag.jpg
       گرفته می‌شود.
    */

    vec4 tex =
        texture2D(
            u_texture,
            uv
        );


    /*
       نور چین‌ها
    */

    float light =
        fabricLight(uv);


    /*
       بافت تار و پود بسیار ریز
    */

    float threadX =
        sin(
            uv.x * 900.0
        );

    float threadY =
        sin(
            uv.y * 900.0
        );


    float threads =
        (
            threadX +
            threadY
        ) * 0.012;


    /*
       بافت طبیعی بسیار ظریف
    */

    float grain =
        noise(
            uv * 500.0
        )
        * 0.025;


    /*
       ترکیب نور پارچه
    */

    float fabric =
        0.62
        + light * 0.55;


    /*
       کمی تغییر نور روی عمق چین
    */

    fabric +=
        v_depth * 0.75;


    vec3 color =
        tex.rgb
        * fabric;


    /*
       تار و پود
    */

    color +=
        vec3(threads + grain);


    /*
       سایه خیلی نرم در لبه‌ها
    */

    float edgeX =
        smoothstep(
            0.0,
            0.045,
            uv.x
        )
        *
        smoothstep(
            1.0,
            0.955,
            uv.x
        );


    float edgeY =
        smoothstep(
            0.0,
            0.035,
            uv.y
        )
        *
        smoothstep(
            1.0,
            0.965,
            uv.y
        );


    float edge =
        edgeX *
        edgeY;


    color *=
        0.78 +
        edge * 0.22;


    gl_FragColor =
        vec4(
            color,
            1.0
        );
}

`;


/* =========================================================
   SHADER COMPILER
========================================================= */

function compileShader(
    type,
    source
) {

    const shader =
        gl.createShader(type);

    gl.shaderSource(
        shader,
        source
    );

    gl.compileShader(
        shader
    );


    if (
        !gl.getShaderParameter(
            shader,
            gl.COMPILE_STATUS
        )
    ) {

        console.error(
            gl.getShaderInfoLog(shader)
        );

        throw new Error(
            "Shader compilation failed"
        );
    }


    return shader;
}


const vertexShader =
    compileShader(
        gl.VERTEX_SHADER,
        vertexShaderSource
    );


const fragmentShader =
    compileShader(
        gl.FRAGMENT_SHADER,
        fragmentShaderSource
    );


const program =
    gl.createProgram();


gl.attachShader(
    program,
    vertexShader
);

gl.attachShader(
    program,
    fragmentShader
);

gl.linkProgram(
    program
);


if (
    !gl.getProgramParameter(
        program,
        gl.LINK_STATUS
    )
) {

    console.error(
        gl.getProgramInfoLog(program)
    );

    throw new Error(
        "Program linking failed"
    );
}


gl.useProgram(
    program
);


/* =========================================================
   FLAG MESH
========================================================= */

const COLS = 180;
const ROWS = 90;

const vertices = [];
const indices = [];


for (
    let y = 0;
    y <= ROWS;
    y++
) {

    for (
        let x = 0;
        x <= COLS;
        x++
    ) {

        const u =
            x / COLS;

        const v =
            y / ROWS;


        vertices.push(
            u,
            v
        );
    }
}


for (
    let y = 0;
    y < ROWS;
    y++
) {

    for (
        let x = 0;
        x < COLS;
        x++
    ) {

        const i =
            y * (COLS + 1)
            + x;


        indices.push(
            i,
            i + 1,
            i + COLS + 1
        );


        indices.push(
            i + 1,
            i + COLS + 2,
            i + COLS + 1
        );
    }
}


/* =========================================================
   POSITION BUFFER
========================================================= */

const positionBuffer =
    gl.createBuffer();

gl.bindBuffer(
    gl.ARRAY_BUFFER,
    positionBuffer
);

gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array(vertices),
    gl.STATIC_DRAW
);


const indexBuffer =
    gl.createBuffer();

gl.bindBuffer(
    gl.ELEMENT_ARRAY_BUFFER,
    indexBuffer
);

gl.bufferData(
    gl.ELEMENT_ARRAY_BUFFER,
    new Uint32Array(indices),
    gl.STATIC_DRAW
);


/* =========================================================
   ATTRIBUTES
========================================================= */

const positionLocation =
    gl.getAttribLocation(
        program,
        "a_position"
    );

const uvLocation =
    gl.getAttribLocation(
        program,
        "a_uv"
    );


gl.bindBuffer(
    gl.ARRAY_BUFFER,
    positionBuffer
);

gl.enableVertexAttribArray(
    positionLocation
);

gl.vertexAttribPointer(
    positionLocation,
    2,
    gl.FLOAT,
    false,
    0,
    0
);


/*
   UV همان position است
*/

gl.enableVertexAttribArray(
    uvLocation
);

gl.vertexAttribPointer(
    uvLocation,
    2,
    gl.FLOAT,
    false,
    0,
    0
);


/* =========================================================
   UNIFORMS
========================================================= */

const timeLocation =
    gl.getUniformLocation(
        program,
        "u_time"
    );

const aspectLocation =
    gl.getUniformLocation(
        program,
        "u_aspect"
    );

const flagAspectLocation =
    gl.getUniformLocation(
        program,
        "u_flagAspect"
    );

const textureLocation =
    gl.getUniformLocation(
        program,
        "u_texture"
    );


/* =========================================================
   FLAG TEXTURE
========================================================= */

const texture =
    gl.createTexture();

const image =
    new Image();

image.onload = () => {

    gl.bindTexture(
        gl.TEXTURE_2D,
        texture
    );


    gl.pixelStorei(
        gl.UNPACK_FLIP_Y_WEBGL,
        true
    );


    gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        image
    );


    gl.texParameteri(
        gl.TEXTURE_2D,
        gl.TEXTURE_MIN_FILTER,
        gl.LINEAR_MIPMAP_LINEAR
    );


    gl.texParameteri(
        gl.TEXTURE_2D,
        gl.TEXTURE_MAG_FILTER,
        gl.LINEAR
    );


    gl.texParameteri(
        gl.TEXTURE_2D,
        gl.TEXTURE_WRAP_S,
        gl.CLAMP_TO_EDGE
    );


    gl.texParameteri(
        gl.TEXTURE_2D,
        gl.TEXTURE_WRAP_T,
        gl.CLAMP_TO_EDGE
    );


    gl.generateMipmap(
        gl.TEXTURE_2D
    );


    requestAnimationFrame(
        render
    );
};


/*
   مهم:
   همین فایل باید داخل webapp باشد.
*/

image.src =
    "flag.jpg";


/* =========================================================
   RESIZE
========================================================= */

function resize() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        Math.floor(
            window.innerWidth * dpr
        );

    canvas.height =
        Math.floor(
            window.innerHeight * dpr
        );


    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";


    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground() {

    /*
       WebGL کل صفحه را می‌گیرد.
       پس قبل از پرچم با یک Quad ساده
       پس‌زمینه ساخته می‌شود.
    */

    gl.clearColor(
        0.025,
        0.015,
        0.009,
        1
    );

    gl.clear(
        gl.COLOR_BUFFER_BIT
    );
}


/* =========================================================
   RENDER
========================================================= */

function render(time) {

    resize();

    drawBackground();


    gl.useProgram(
        program
    );


    gl.bindTexture(
        gl.TEXTURE_2D,
        texture
    );


    gl.uniform1f(
        timeLocation,
        time * 0.001
    );


    gl.uniform1f(
        aspectLocation,
        canvas.width /
        canvas.height
    );


    gl.uniform1f(
        flagAspectLocation,
        1.6
    );


    gl.uniform1i(
        textureLocation,
        0
    );


    /*
       پرچم
    */

    gl.drawElements(
        gl.TRIANGLES,
        indices.length,
        gl.UNSIGNED_INT,
        0
    );


    requestAnimationFrame(
        render
    );
}

</script>

</body>
</html>
